# Supabase pauses free projects after a week without activity. A tiny read every 3 days keeps the
# accounts database awake (docs/DEPLOY.md, "Cuentas"). Uses only the public anon key.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one ranking row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Accounts not configured (no SUPABASE_URL / SUPABASE_ANON_KEY secrets): nothing to ping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/ranking_wins?select=games&limit=1")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
