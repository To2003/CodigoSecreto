# CI (SPEC §0.3, CONSTRAINTS.md "CI / cierre de hito"). Free GitHub Actions minutes only.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Production builds refuse to run without it (vite.config.ts); E2E talks to the local server.
  VITE_SERVER_URL: http://localhost:3001

jobs:
  checks:
    name: Tipos, lint, tests y bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Floor guard (cada commit contra su padre)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-floor-guard.sh "$BASE" "$TIP"
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm size

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (landing)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clave/web build
      # The landing measured as players get it: with the server up (otherwise the wake screen
      # covers it). The preview runs on :4173, so that's the allowed origin.
      - run: pnpm --filter @clave/server build
      - name: Game server
        run: |
          cd apps/server
          CLIENT_ORIGIN=http://localhost:4173 LOG_LEVEL=warn node dist/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && break; sleep 1; done
      # SPEC §10: Performance ≥ 90 and Accessibility ≥ 95 on the landing (lighthouserc.json).
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  security:
    name: Seguridad (gitleaks, osv-scanner, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
      - name: osv-scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pnpm-lock.yaml
      - name: semgrep
        run: |
          pipx run semgrep==1.97.0 scan --error --metrics=off \
            --config p/typescript --config p/nodejs --config p/secrets \
            --exclude 'e2e' --exclude '**/*.test.ts'
