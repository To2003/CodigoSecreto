# Render Blueprint for the game server (SPEC §0.3: Render free, no card). See docs/DEPLOY.md.
services:
  - type: web
    name: clave-server
    runtime: node
    plan: free
    # Closest free region to Argentina.
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @clave/server build
    startCommand: pnpm --filter @clave/server start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      # The Vercel URL of the web app, e.g. https://clave.vercel.app (comma-separated for more).
      - key: CLIENT_ORIGIN
        sync: false
      # Render puts one proxy in front: its X-Forwarded-For entry is the player's IP.
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: ROOMS_PER_MINUTE
        value: '10'
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
      # Optional accounts (docs/specs/M9-cuentas.md). Without them everyone plays as a guest.
      # Set in the dashboard, never here: AUTH_MODE=supabase plus the two Supabase values.
      - key: AUTH_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      # SECRET. Only in Render's environment; never in the repo, the web app or a log.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STATS_MIN_GAME_SECONDS
        value: '300'
